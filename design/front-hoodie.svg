<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400">
  <defs>
    <!-- Garment Shading Gradients -->
    <linearGradient id="hoodie-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22" />
      <stop offset="35%" stop-color="#0E1015" />
      <stop offset="70%" stop-color="#0A0C0F" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <linearGradient id="hood-interior-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030406" />
      <stop offset="60%" stop-color="#090A0E" />
      <stop offset="100%" stop-color="#14171E" />
    </linearGradient>

    <linearGradient id="sleeve-left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1E26" />
      <stop offset="50%" stop-color="#101217" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>

    <linearGradient id="sleeve-right-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B1E26" />
      <stop offset="50%" stop-color="#101217" />
      <stop offset="100%" stop-color="#08090C" />
    </linearGradient>

    <linearGradient id="pocket-shading" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1D25" />
      <stop offset="15%" stop-color="#111319" />
      <stop offset="85%" stop-color="#0C0E12" />
      <stop offset="100%" stop-color="#060709" />
    </linearGradient>

    <linearGradient id="metal-aglet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="40%" stop-color="#F3F4F6" />
      <stop offset="70%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>

    <filter id="fabric-soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Orbitron:wght@600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .font-orbitron { font-family: 'Orbitron', 'Space Grotesk', system-ui, sans-serif; }
      .font-inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <!-- Background Grid & Context -->
  <rect width="1200" height="1400" fill="#060709" />
  <g opacity="0.12">
    <circle cx="600" cy="700" r="500" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="6 8" />
    <circle cx="600" cy="700" r="350" fill="none" stroke="#6B7280" stroke-width="0.8" />
    <line x1="100" y1="700" x2="1100" y2="700" stroke="#6B7280" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="600" y1="100" x2="600" y2="1300" stroke="#6B7280" stroke-width="0.8" stroke-dasharray="4 6" />
  </g>

  <!-- ============================================== -->
  <!-- MAIN HOODIE GARMENT: FRONT VIEW                 -->
  <!-- ============================================== -->
  <g id="garment-front" filter="url(#fabric-soft-shadow)">
    <!-- 1. Left Sleeve (Viewer's Left) -->
    <path id="left-sleeve"
      d="M 370 330 
         C 310 370, 210 520, 150 780 
         C 145 805, 155 830, 185 845 
         L 260 870 
         C 285 878, 305 860, 312 835 
         C 345 720, 375 600, 395 520 
         L 405 520 Z"
      fill="url(#sleeve-left-grad)" stroke="#1F242F" stroke-width="1.5" />

    <!-- Left Ribbed Cuff -->
    <g id="left-cuff" transform="rotate(18, 220, 855)">
      <rect x="175" y="825" width="95" height="48" rx="6" fill="#141720" stroke="#252A36" stroke-width="1.2" />
      <!-- Rib Knit Lines -->
      <line x1="190" y1="827" x2="190" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="205" y1="827" x2="205" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="220" y1="827" x2="220" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="235" y1="827" x2="235" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="250" y1="827" x2="250" y2="871" stroke="#2B313E" stroke-width="1.5" />
    </g>

    <!-- 2. Right Sleeve (Viewer's Right) -->
    <path id="right-sleeve"
      d="M 830 330 
         C 890 370, 990 520, 1050 780 
         C 1055 805, 1045 830, 1015 845 
         L 940 870 
         C 915 878, 895 860, 888 835 
         C 855 720, 825 600, 805 520 
         L 795 520 Z"
      fill="url(#sleeve-right-grad)" stroke="#1F242F" stroke-width="1.5" />

    <!-- Right Ribbed Cuff -->
    <g id="right-cuff" transform="rotate(-18, 980, 855)">
      <rect x="930" y="825" width="95" height="48" rx="6" fill="#141720" stroke="#252A36" stroke-width="1.2" />
      <!-- Rib Knit Lines -->
      <line x1="945" y1="827" x2="945" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="960" y1="827" x2="960" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="975" y1="827" x2="975" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="990" y1="827" x2="990" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="1005" y1="827" x2="1005" y2="871" stroke="#2B313E" stroke-width="1.5" />
    </g>

    <!-- 3. Torso Main Body -->
    <path id="hoodie-torso"
      d="M 400 320 
         C 460 340, 540 350, 600 350 
         C 660 350, 740 340, 800 320 
         C 820 380, 835 470, 840 570 
         C 845 690, 840 890, 835 1060 
         L 365 1060 
         C 360 890, 355 690, 360 570 
         C 365 470, 380 380, 400 320 Z"
      fill="url(#hoodie-body-grad)" stroke="#1F242F" stroke-width="1.5" />

    <!-- Side Panel Ergonomic Ribbing / Seam Definition -->
    <path d="M 405 530 C 400 700, 402 890, 395 1060" fill="none" stroke="#1B202B" stroke-width="2" stroke-dasharray="4 3" />
    <path d="M 795 530 C 800 700, 798 890, 805 1060" fill="none" stroke="#1B202B" stroke-width="2" stroke-dasharray="4 3" />

    <!-- 4. Kangaroo Pocket -->
    <g id="kangaroo-pocket">
      <path
        d="M 450 780 
           L 750 780 
           C 765 780, 775 790, 775 805 
           L 790 950 
           C 792 965, 785 980, 770 985 
           L 755 990 
           L 445 990 
           L 430 985 
           C 415 980, 408 965, 410 950 
           L 425 805 
           C 425 790, 435 780, 450 780 Z"
        fill="url(#pocket-shading)" stroke="#222836" stroke-width="1.8" />

      <!-- Pocket Openings Topstitch -->
      <path d="M 425 805 L 450 780" stroke="#3B82F6" stroke-width="1.5" opacity="0.6" />
      <path d="M 775 805 L 750 780" stroke="#3B82F6" stroke-width="1.5" opacity="0.6" />
      <line x1="450" y1="785" x2="750" y2="785" stroke="#181C25" stroke-width="1.5" />
      <!-- Bar-Tack Reinforcements -->
      <line x1="448" y1="778" x2="448" y2="786" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
      <line x1="752" y1="778" x2="752" y2="786" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
      <line x1="412" y1="952" x2="418" y2="954" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
      <line x1="788" y1="952" x2="782" y2="954" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- 5. Waistband Hem (2x2 Heavy Rib Knit) -->
    <g id="waistband">
      <path
        d="M 365 1058 
           L 835 1058 
           C 840 1060, 842 1065, 842 1072 
           L 838 1140 
           C 838 1146, 832 1152, 825 1152 
           L 375 1152 
           C 368 1152, 362 1146, 362 1140 
           L 358 1072 
           C 358 1065, 360 1060, 365 1058 Z"
        fill="#12151D" stroke="#252A36" stroke-width="1.5" />
      <!-- Vertical Ribbing Texture -->
      <line x1="390" y1="1062" x2="390" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="420" y1="1062" x2="420" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="450" y1="1062" x2="450" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="480" y1="1062" x2="480" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="510" y1="1062" x2="510" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="540" y1="1062" x2="540" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="570" y1="1062" x2="570" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="600" y1="1062" x2="600" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="630" y1="1062" x2="630" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="660" y1="1062" x2="660" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="690" y1="1062" x2="690" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="720" y1="1062" x2="720" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="750" y1="1062" x2="750" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="780" y1="1062" x2="780" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="810" y1="1062" x2="810" y2="1148" stroke="#1E232E" stroke-width="1.5" />
    </g>

    <!-- 6. Hood Structure (Double-Lined Crossover Hood) -->
    <g id="hood-structure">
      <!-- Back Interior Lined Cavity -->
      <path
        d="M 480 280 
           C 510 240, 560 220, 600 220 
           C 640 220, 690 240, 720 280 
           C 670 330, 530 330, 480 280 Z"
        fill="url(#hood-interior-shadow)" stroke="#111319" stroke-width="1.5" />

      <!-- Left Hood Wing -->
      <path
        d="M 400 320 
           C 380 240, 410 140, 480 80 
           C 540 30, 600 30, 630 35 
           C 590 80, 520 180, 510 320 
           C 470 335, 430 330, 400 320 Z"
        fill="#1C202A" stroke="#252A36" stroke-width="1.5" />

      <!-- Right Hood Wing (Crossover Front) -->
      <path
        d="M 800 320 
           C 820 240, 790 140, 720 80 
           C 660 30, 600 30, 570 35 
           C 610 80, 680 180, 690 320 
           C 730 335, 770 330, 800 320 Z"
        fill="#151821" stroke="#252A36" stroke-width="1.5" />

      <!-- Hood Opening Face Rim -->
      <path
        d="M 480 80 
           C 540 30, 660 30, 720 80 
           C 780 140, 740 280, 690 325 
           C 650 355, 550 355, 510 325 
           C 460 280, 420 140, 480 80 Z"
        fill="none" stroke="#2D3342" stroke-width="3" />

      <!-- Gunmetal Eyelets -->
      <circle cx="560" cy="335" r="7" fill="#1F242F" stroke="#9CA3AF" stroke-width="1.5" />
      <circle cx="560" cy="335" r="3.5" fill="#0A0B0E" />

      <circle cx="640" cy="335" r="7" fill="#1F242F" stroke="#9CA3AF" stroke-width="1.5" />
      <circle cx="640" cy="335" r="3.5" fill="#0A0B0E" />

      <!-- Drawstrings with Natural Drape -->
      <!-- Left Drawstring -->
      <path
        d="M 560 340 
           C 560 390, 545 440, 550 510 
           C 552 540, 560 565, 558 590"
        fill="none" stroke="#E5E7EB" stroke-width="4.5" stroke-linecap="round" />
      <!-- Left Custom Metal Aglet -->
      <rect x="553" y="590" width="10" height="28" rx="2" fill="url(#metal-aglet)" stroke="#1F242F" stroke-width="0.8" />
      <!-- Tech Blue Aglet Tip Thread -->
      <rect x="553" y="614" width="10" height="4" fill="#3B82F6" />

      <!-- Right Drawstring -->
      <path
        d="M 640 340 
           C 640 395, 658 450, 650 520 
           C 646 550, 640 580, 642 610"
        fill="none" stroke="#E5E7EB" stroke-width="4.5" stroke-linecap="round" />
      <!-- Right Custom Metal Aglet -->
      <rect x="637" y="610" width="10" height="28" rx="2" fill="url(#metal-aglet)" stroke="#1F242F" stroke-width="0.8" />
      <rect x="637" y="634" width="10" height="4" fill="#3B82F6" />
    </g>

    <!-- Contrast Technical Shoulder Taping (Tech Blue Piping) -->
    <path d="M 400 320 L 480 270" stroke="#3B82F6" stroke-width="2.5" opacity="0.85" />
    <path d="M 800 320 L 720 270" stroke="#3B82F6" stroke-width="2.5" opacity="0.85" />
  </g>

  <!-- ============================================== -->
  <!-- FRONT GRAPHIC ARTWORK (SCREEN PRINT & EMBROIDERY)-->
  <!-- ============================================== -->
  <g id="artwork-front">
    <!-- 1. LEFT CHEST BRANDING (Compact, Refined, Wearable) -->
    <g id="chest-brand" transform="translate(450, 420)">
      <!-- Geometric Hex Monogram -->
      <polygon points="18,0 36,10 36,32 18,42 0,32 0,10" fill="none" stroke="#3B82F6" stroke-width="1.8" />
      <path d="M 8 16 H 28 M 18 16 V 32 M 12 24 H 24" stroke="#F3F4F6" stroke-width="1.5" stroke-linecap="round" />
      
      <!-- Techfest Typography -->
      <text x="48" y="16" fill="#F3F4F6" font-size="16" font-weight="800" class="font-orbitron" letter-spacing="2">TECHFEST</text>
      <text x="48" y="29" fill="#3B82F6" font-size="8.5" font-weight="600" class="font-mono" letter-spacing="1.5">// ED.2026-27</text>
      <text x="48" y="39" fill="#6B7280" font-size="7.5" font-weight="500" class="font-inter" letter-spacing="1">IIT BOMBAY CONCEPT LAB</text>
      <circle cx="160" cy="12" r="2" fill="#3B82F6" />
    </g>

    <!-- 2. ARCHITECTURAL LINE ART ON LOWER FLANK (Subtle Tone-on-Tone) -->
    <g id="architectural-line-art" transform="translate(420, 680)" opacity="0.45">
      <!-- Technical Grid Matrix -->
      <path d="M 0 0 L 160 0 L 220 60 L 220 180 L 0 180 Z" fill="none" stroke="#6B7280" stroke-width="0.8" stroke-dasharray="3 3" />
      <!-- Structural Truss Angles -->
      <line x1="0" y1="60" x2="160" y2="60" stroke="#6B7280" stroke-width="0.8" />
      <line x1="0" y1="120" x2="220" y2="120" stroke="#6B7280" stroke-width="0.8" />
      <line x1="40" y1="0" x2="100" y2="60" stroke="#3B82F6" stroke-width="1" />
      <line x1="100" y1="0" x2="160" y2="60" stroke="#6B7280" stroke-width="0.8" />
      <line x1="60" y1="60" x2="120" y2="120" stroke="#3B82F6" stroke-width="1" />
      <line x1="120" y1="60" x2="180" y2="120" stroke="#6B7280" stroke-width="0.8" />
      <line x1="180" y1="60" x2="220" y2="100" stroke="#6B7280" stroke-width="0.8" />
      <!-- Coordinate Telemetry Callout -->
      <text x="10" y="170" fill="#3B82F6" font-size="7.5" font-family="monospace" letter-spacing="1">19.1334° N // 72.9133° E [SAC_POWAI]</text>
    </g>

    <!-- 3. SLEEVE GRAPHICS -->
    <!-- Left Sleeve (Viewer's Left): Vertical Slogan -->
    <g id="sleeve-left-slogan" transform="translate(235, 480) rotate(58)">
      <text x="0" y="0" fill="#F3F4F6" font-size="9.5" font-weight="700" class="font-orbitron" letter-spacing="3" opacity="0.85">
        EXPLORE // BUILD // COLLABORATE // BELONG
      </text>
      <!-- Sub-line micro coordinate -->
      <line x1="0" y1="6" x2="330" y2="6" stroke="#3B82F6" stroke-width="1" />
    </g>

    <!-- Right Sleeve (Viewer's Right): Technical Patch -->
    <g id="sleeve-right-patch" transform="translate(930, 680) rotate(-58)">
      <rect x="0" y="0" width="85" height="24" fill="#0B0D10" stroke="#3B82F6" stroke-width="1" rx="2" />
      <text x="8" y="15" fill="#F3F4F6" font-size="7.5" font-weight="700" class="font-mono">TECHFEST.27</text>
      <circle cx="75" cy="12" r="3" fill="#3B82F6" />
    </g>
  </g>

  <!-- Title & Specification Annotation in Canvas Margin -->
  <g id="margin-annotation" transform="translate(60, 1330)">
    <text x="0" y="0" fill="#F3F4F6" font-size="14" font-weight="700" class="font-orbitron">FRONT SPECIFICATION // 450 GSM BRUSHED FRENCH TERRY</text>
    <text x="0" y="20" fill="#6B7280" font-size="11" class="font-inter">Placement: Left chest high-density silicone transfer + Lower-flank tone-on-tone discharge print</text>
  </g>
</svg>
