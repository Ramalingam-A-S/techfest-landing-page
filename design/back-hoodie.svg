<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" width="1200" height="1400">
  <defs>
    <!-- Garment Shading Gradients -->
    <linearGradient id="back-hoodie-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191C24" />
      <stop offset="30%" stop-color="#0E1015" />
      <stop offset="70%" stop-color="#0A0C0F" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <linearGradient id="back-hood-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E222D" />
      <stop offset="50%" stop-color="#141720" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>

    <linearGradient id="back-sleeve-left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D25" />
      <stop offset="60%" stop-color="#0F1116" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <linearGradient id="back-sleeve-right-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1D25" />
      <stop offset="60%" stop-color="#0F1116" />
      <stop offset="100%" stop-color="#07080B" />
    </linearGradient>

    <linearGradient id="planet-crescent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#F3F4F6" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#6B7280" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0B0D10" stop-opacity="0" />
    </linearGradient>

    <filter id="back-fabric-soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="35" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Orbitron:wght@600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      .font-orbitron { font-family: 'Orbitron', 'Space Grotesk', system-ui, sans-serif; }
      .font-inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
  </defs>

  <!-- Background Canvas Grid -->
  <rect width="1200" height="1400" fill="#060709" />
  <g opacity="0.12">
    <circle cx="600" cy="700" r="500" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="6 8" />
    <circle cx="600" cy="700" r="350" fill="none" stroke="#6B7280" stroke-width="0.8" />
    <line x1="100" y1="700" x2="1100" y2="700" stroke="#6B7280" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="600" y1="100" x2="600" y2="1300" stroke="#6B7280" stroke-width="0.8" stroke-dasharray="4 6" />
  </g>

  <!-- ============================================== -->
  <!-- MAIN HOODIE GARMENT: REAR VIEW                  -->
  <!-- ============================================== -->
  <g id="garment-back" filter="url(#back-fabric-soft-shadow)">
    <!-- 1. Left Sleeve (Rear) -->
    <path id="back-left-sleeve"
      d="M 370 330 
         C 310 370, 210 520, 150 780 
         C 145 805, 155 830, 185 845 
         L 260 870 
         C 285 878, 305 860, 312 835 
         C 345 720, 375 600, 395 520 
         L 405 520 Z"
      fill="url(#back-sleeve-left-grad)" stroke="#1F242F" stroke-width="1.5" />

    <!-- Left Cuff (Rear) -->
    <g id="back-left-cuff" transform="rotate(18, 220, 855)">
      <rect x="175" y="825" width="95" height="48" rx="6" fill="#141720" stroke="#252A36" stroke-width="1.2" />
      <line x1="190" y1="827" x2="190" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="205" y1="827" x2="205" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="220" y1="827" x2="220" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="235" y1="827" x2="235" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="250" y1="827" x2="250" y2="871" stroke="#2B313E" stroke-width="1.5" />
    </g>

    <!-- 2. Right Sleeve (Rear) -->
    <path id="back-right-sleeve"
      d="M 830 330 
         C 890 370, 990 520, 1050 780 
         C 1055 805, 1045 830, 1015 845 
         L 940 870 
         C 915 878, 895 860, 888 835 
         C 855 720, 825 600, 805 520 
         L 795 520 Z"
      fill="url(#back-sleeve-right-grad)" stroke="#1F242F" stroke-width="1.5" />

    <!-- Right Cuff (Rear) -->
    <g id="back-right-cuff" transform="rotate(-18, 980, 855)">
      <rect x="930" y="825" width="95" height="48" rx="6" fill="#141720" stroke="#252A36" stroke-width="1.2" />
      <line x1="945" y1="827" x2="945" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="960" y1="827" x2="960" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="975" y1="827" x2="975" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="990" y1="827" x2="990" y2="871" stroke="#2B313E" stroke-width="1.5" />
      <line x1="1005" y1="827" x2="1005" y2="871" stroke="#2B313E" stroke-width="1.5" />
    </g>

    <!-- 3. Torso Main Body (Rear View - Clean Solid Canvas) -->
    <path id="back-hoodie-torso"
      d="M 400 320 
         C 460 340, 540 348, 600 348 
         C 660 348, 740 340, 800 320 
         C 820 380, 835 470, 840 570 
         C 845 690, 840 890, 835 1060 
         L 365 1060 
         C 360 890, 355 690, 360 570 
         C 365 470, 380 380, 400 320 Z"
      fill="url(#back-hoodie-body-grad)" stroke="#1F242F" stroke-width="1.5" />

    <!-- Side Panel Ergonomic Seams -->
    <path d="M 405 530 C 400 700, 402 890, 395 1060" fill="none" stroke="#1B202B" stroke-width="2" stroke-dasharray="4 3" />
    <path d="M 795 530 C 800 700, 798 890, 805 1060" fill="none" stroke="#1B202B" stroke-width="2" stroke-dasharray="4 3" />

    <!-- 4. Waistband (Rear View) -->
    <g id="back-waistband">
      <path
        d="M 365 1058 
           L 835 1058 
           C 840 1060, 842 1065, 842 1072 
           L 838 1140 
           C 838 1146, 832 1152, 825 1152 
           L 375 1152 
           C 368 1152, 362 1146, 362 1140 
           L 358 1072 
           C 358 1065, 360 1060, 365 1058 Z"
        fill="#12151D" stroke="#252A36" stroke-width="1.5" />
      <line x1="390" y1="1062" x2="390" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="420" y1="1062" x2="420" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="450" y1="1062" x2="450" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="480" y1="1062" x2="480" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="510" y1="1062" x2="510" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="540" y1="1062" x2="540" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="570" y1="1062" x2="570" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="600" y1="1062" x2="600" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="630" y1="1062" x2="630" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="660" y1="1062" x2="660" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="690" y1="1062" x2="690" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="720" y1="1062" x2="720" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="750" y1="1062" x2="750" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="780" y1="1062" x2="780" y2="1148" stroke="#1E232E" stroke-width="1.5" />
      <line x1="810" y1="1062" x2="810" y2="1148" stroke="#1E232E" stroke-width="1.5" />
    </g>

    <!-- 5. Hood Resting on Back (Realistic Streetwear Drape) -->
    <g id="back-hood-drape">
      <!-- Hood Main Downward Flap -->
      <path
        d="M 440 280 
           C 430 180, 480 90, 600 90 
           C 720 90, 770 180, 760 280 
           C 750 360, 680 410, 600 410 
           C 520 410, 450 360, 440 280 Z"
        fill="url(#back-hood-grad)" stroke="#252A36" stroke-width="1.8" />
      
      <!-- Hood Center Vertical Seam & Dart -->
      <path d="M 600 90 L 600 408" stroke="#101319" stroke-width="2" />
      <path d="M 520 330 C 560 370, 640 370, 680 330" fill="none" stroke="#252A36" stroke-width="1.2" opacity="0.6" />
      
      <!-- Fold Shadow under Hood -->
      <path d="M 460 390 C 530 425, 670 425, 740 390 C 680 435, 520 435, 460 390 Z" fill="#050608" opacity="0.75" />
    </g>

    <!-- Contrast Tech Blue Shoulder Tape -->
    <path d="M 400 320 L 470 270" stroke="#3B82F6" stroke-width="2.5" opacity="0.85" />
    <path d="M 800 320 L 730 270" stroke="#3B82F6" stroke-width="2.5" opacity="0.85" />
  </g>

  <!-- ============================================== -->
  <!-- HERO BACK ARTWORK: MONUMENTAL STATEMENT         -->
  <!-- ============================================== -->
  <g id="artwork-back" transform="translate(0, 30)">
    <!-- 1. UPPER BACK BOLD TYPOGRAPHY -->
    <g id="back-headline" transform="translate(600, 445)" text-anchor="middle">
      <!-- Dominant Techfest Wordmark -->
      <text x="0" y="0" fill="#F3F4F6" font-size="44" font-weight="900" class="font-orbitron" letter-spacing="8">TECHFEST</text>
      <!-- Subtitle & Brand Attribution -->
      <text x="0" y="24" fill="#3B82F6" font-size="11" font-weight="700" class="font-mono" letter-spacing="4">
        IIT BOMBAY // ANNUAL SCIENCE &amp; TECHNOLOGY FESTIVAL
      </text>
      <!-- Alignment Divider Line with Tech Blue Nodes -->
      <line x1="-220" y1="36" x2="220" y2="36" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 4" />
      <circle cx="-220" cy="36" r="3" fill="#3B82F6" />
      <circle cx="0" cy="36" r="3" fill="#F3F4F6" />
      <circle cx="220" cy="36" r="3" fill="#3B82F6" />
    </g>

    <!-- 2. MONUMENTAL PLANETARY & ARCHITECTURAL COMPOSITION (Center Back) -->
    <g id="back-center-illustration" transform="translate(600, 680)">
      <!-- Outer Orbit Ring 1 (Tech Blue Trajectory) -->
      <ellipse cx="0" cy="0" rx="260" ry="110" fill="none" stroke="#3B82F6" stroke-width="1.8" stroke-dasharray="8 5" transform="rotate(-22)" />
      <!-- Orbital Telemetry Vector Arrows & Nodes -->
      <circle cx="-230" cy="65" r="4.5" fill="#3B82F6" />
      <circle cx="210" cy="-60" r="3" fill="#F3F4F6" />
      <path d="M 205 -65 L 220 -60 L 210 -45" fill="none" stroke="#3B82F6" stroke-width="1.5" />

      <!-- Outer Orbit Ring 2 (Counter-Axis) -->
      <ellipse cx="0" cy="0" rx="240" ry="85" fill="none" stroke="#6B7280" stroke-width="1" stroke-dasharray="3 3" transform="rotate(40)" />

      <!-- Central Planetary Sphere -->
      <circle cx="0" cy="0" r="145" fill="#0C0E14" stroke="#F3F4F6" stroke-width="2" />
      <!-- High-Tech Halftone / Latitude-Longitude Grid Rings inside Planet -->
      <ellipse cx="0" cy="0" rx="145" ry="50" fill="none" stroke="#6B7280" stroke-width="0.8" opacity="0.6" />
      <ellipse cx="0" cy="0" rx="145" ry="100" fill="none" stroke="#6B7280" stroke-width="0.8" opacity="0.6" />
      <line x1="0" y1="-145" x2="0" y2="145" stroke="#6B7280" stroke-width="0.8" opacity="0.6" />
      <line x1="-145" y1="0" x2="145" y2="0" stroke="#3B82F6" stroke-width="1" opacity="0.8" />
      <!-- Crescent Shading Mask / Horizon Glow -->
      <path d="M 0 -145 A 145 145 0 0 1 145 0 A 145 145 0 0 1 0 145 A 145 120 0 0 0 0 -145 Z" fill="url(#planet-crescent-glow)" />

      <!-- Architectural Elevation & Blueprint Wireframe Juxtaposition -->
      <g id="architectural-elevation" stroke="#F3F4F6" stroke-width="1.2" opacity="0.9">
        <!-- Geodesic Dome / Habitat Structure across lower hemisphere -->
        <path d="M -90 40 Q 0 -60, 90 40 Z" fill="#080A0E" stroke="#3B82F6" stroke-width="1.5" />
        <line x1="-90" y1="40" x2="0" y2="-60" stroke="#6B7280" stroke-width="0.8" />
        <line x1="90" y1="40" x2="0" y2="-60" stroke="#6B7280" stroke-width="0.8" />
        <line x1="-50" y1="40" x2="0" y2="-60" stroke="#6B7280" stroke-width="0.8" />
        <line x1="50" y1="40" x2="0" y2="-60" stroke="#6B7280" stroke-width="0.8" />
        <line x1="-75" y1="15" x2="75" y2="15" stroke="#6B7280" stroke-width="0.8" />
        <line x1="-45" y1="-15" x2="45" y2="-15" stroke="#6B7280" stroke-width="0.8" />

        <!-- Vertical Space-Elevator / Communication Pylon -->
        <line x1="0" y1="-180" x2="0" y2="90" stroke="#F3F4F6" stroke-width="2" />
        <polygon points="0,-190 6,-180 -6,-180" fill="#3B82F6" />
        <!-- Structural Guy-Wires -->
        <line x1="0" y1="-160" x2="-60" y2="40" stroke="#3B82F6" stroke-width="0.8" stroke-dasharray="2 2" />
        <line x1="0" y1="-160" x2="60" y2="40" stroke="#3B82F6" stroke-width="0.8" stroke-dasharray="2 2" />
        <!-- Technical Crosshair Marks -->
        <circle cx="0" cy="-60" r="12" fill="none" stroke="#3B82F6" stroke-width="1" />
        <line x1="-18" y1="-60" x2="18" y2="-60" stroke="#3B82F6" stroke-width="1" />
        <line x1="0" y1="-78" x2="0" y2="-42" stroke="#3B82F6" stroke-width="1" />
      </g>
    </g>

    <!-- 3. EDITORIAL TEXT PILL: "IDEAS / PEOPLE / TECHNOLOGY / IMPACT" -->
    <g id="editorial-pillars" transform="translate(600, 885)" text-anchor="middle">
      <rect x="-190" y="-14" width="380" height="28" rx="14" fill="#0F1218" stroke="#3B82F6" stroke-width="1.2" />
      <text x="0" y="4" fill="#F3F4F6" font-size="9.5" font-weight="700" class="font-mono" letter-spacing="3">
        IDEAS  /  PEOPLE  /  TECHNOLOGY  /  IMPACT
      </text>
    </g>

    <!-- 4. BOTTOM CLIMAX TAGLINE: "A BRIGHTER TOMORROW. TOGETHER." -->
    <g id="bottom-tagline" transform="translate(600, 940)" text-anchor="middle">
      <text x="0" y="0" fill="#F3F4F6" font-size="16" font-weight="800" class="font-orbitron" letter-spacing="4">
        A BRIGHTER TOMORROW. TOGETHER.
      </text>
      <!-- Technical Coordinate Sub-line -->
      <text x="0" y="18" fill="#6B7280" font-size="8.5" font-weight="500" class="font-mono" letter-spacing="2">
        IIT BOMBAY POWAI // LAT 19.1334° N // LONG 72.9133° E // CONCEPT 2026-27
      </text>
      <!-- Registration Crosshairs -->
      <g stroke="#3B82F6" stroke-width="1">
        <line x1="-180" y1="30" x2="-160" y2="30" />
        <line x1="-170" y1="20" x2="-170" y2="40" />
        <circle cx="-170" cy="30" r="3" fill="none" />

        <line x1="160" y1="30" x2="180" y2="30" />
        <line x1="170" y1="20" x2="170" y2="40" />
        <circle cx="170" cy="30" r="3" fill="none" />
      </g>
    </g>
  </g>

  <!-- Title & Specification Annotation in Canvas Margin -->
  <g id="margin-annotation-back" transform="translate(60, 1330)">
    <text x="0" y="0" fill="#F3F4F6" font-size="14" font-weight="700" class="font-orbitron">BACK SPECIFICATION // JUMBO OVERSIZED BACKPRINT</text>
    <text x="0" y="20" fill="#6B7280" font-size="11" class="font-inter">Placement: Centered 120mm down from hood seam // Screenprint: 4-Color High-Elastic Plastisol + Discharge</text>
  </g>
</svg>
